name: Expand WebControl release source
on:
  push:
    branches: [main]
    paths:
      - '.webcontrol-archive/READY'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/webcontrol-release
          cat .webcontrol-archive/part-* | base64 --decode > /tmp/webcontrol-release/release.zip
          unzip -q /tmp/webcontrol-release/release.zip -d /tmp/webcontrol-release/unpacked
          cp -a /tmp/webcontrol-release/unpacked/webcontrol-release/. .
          rm -rf .webcontrol-archive webcontrol-release
          rm -f pages.yml uptime-monitor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete WebControl 1.0.0 source release"
          git push
